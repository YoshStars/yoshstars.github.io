<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClubIGT - Servicios Técnicos Apple Premium</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
/* ================= RESET ================= */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif
}

/* ================= VARIABLES ================= */
:root{
    --primary:#1D1D1F;
    --secondary:#86868B;
    --accent:#007AFF;
    --accent-hover:#0056CC;
    --light:#F5F5F7;
    --border:#D2D2D7;
    --card-bg:#FFFFFF;
    --gradient:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
}

/* ================= BODY ================= */
body{
    background:var(--light);
    color:var(--primary);
    overflow-x:hidden
}

/* ================= LOCK SCREEN ================= */
#lockScreen{
    position:fixed;
    inset:0;
    background:linear-gradient(135deg,#000,#1d1d1f);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:99999
}
.lock-box{
    background:#fff;
    padding:40px;
    border-radius:20px;
    width:90%;
    max-width:360px;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.5)
}
.lock-box h2{margin-bottom:10px}
.lock-box input{
    width:100%;
    padding:14px;
    margin:20px 0;
    border-radius:12px;
    border:1px solid var(--border);
    font-size:16px;
    text-align:center
}
.lock-box button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:25px;
    background:var(--accent);
    color:#fff;
    font-weight:600;
    cursor:pointer
}
#errorMsg{
    color:red;
    margin-top:15px;
    display:none
}

/* ================= HEADER ================= */
header{
    position:fixed;
    top:0;
    width:100%;
    background:rgba(255,255,255,.95);
    backdrop-filter:blur(20px);
    border-bottom:1px solid var(--border);
    z-index:1000
}
.container{
    max-width:1200px;
    margin:auto;
    padding:0 20px
}
.nav-container{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 0
}
.logo{
    font-size:28px;
    font-weight:800;
    cursor:pointer
}
.nav-links{
    display:flex;
    list-style:none;
    gap:40px
}
.nav-links a{
    text-decoration:none;
    color:var(--primary);
    font-weight:500;
    cursor:pointer
}

/* Hamburguesa */
.menu-btn{
    display:none;
    font-size:26px;
    cursor:pointer
}

/* ================= SECTIONS ================= */
.section{
    min-height:100vh;
    padding:120px 0 80px;
    display:none
}
.section.active{
    display:flex;
    align-items:center;
    justify-content:center
}

/* ================= HERO ================= */
.hero{
    text-align:center;
    max-width:800px
}
.hero h1{
    font-size:4rem;
    font-weight:800;
    margin-bottom:24px
}
.hero p{
    font-size:1.3rem;
    color:var(--secondary)
}
.btn{
    background:var(--accent);
    color:#fff;
    padding:14px 32px;
    border-radius:25px;
    border:none;
    font-weight:600;
    cursor:pointer;
    margin-top:40px
}

/* ================= RESPONSIVE ================= */
@media(max-width:768px){
    .menu-btn{display:block}
    .nav-links{
        position:absolute;
        top:80px;
        left:0;
        width:100%;
        background:#fff;
        flex-direction:column;
        align-items:center;
        padding:30px 0;
        display:none
    }
    .nav-links.active{display:flex}
    .hero h1{font-size:2.6rem}
}
</style>
</head>

<body>

<!-- 🔐 LOCK -->
<div id="lockScreen">
    <div class="lock-box">
        <h2>Acceso Privado</h2>
        <p>Ingresa el código</p>
        <input type="password" id="accessCode" placeholder="Código de acceso">
        <button onclick="checkCode()">Entrar</button>
        <p id="errorMsg">Código incorrecto</p>
    </div>
</div>

<!-- HEADER -->
<header>
    <div class="container nav-container">
        <div class="logo" onclick="showSection('inicio')">ClubIGT</div>
        <i class="fas fa-bars menu-btn" onclick="toggleMenu()"></i>
        <ul class="nav-links" id="menu">
            <li><a onclick="showSection('inicio')">Inicio</a></li>
            <li><a onclick="showSection('servicios')">Servicios</a></li>
            <li><a onclick="showSection('contacto')">Contacto</a></li>
        </ul>
    </div>
</header>

<!-- SECTIONS -->
<section id="inicio" class="section active">
    <div class="hero">
        <h1>Servicios Técnicos Apple Premium</h1>
        <p>Reparación profesional con garantía real</p>
        <button class="btn" onclick="showSection('servicios')">Ver servicios</button>
    </div>
</section>

<section id="servicios" class="section">
    <h2>Nuestros Servicios</h2>
</section>

<section id="contacto" class="section">
    <h2>Contacto</h2>
</section>

<script>
/* LOCK */
document.body.style.overflow="hidden"
function checkCode(){
    const code=document.getElementById("accessCode").value
    if(code==="1212"){
        document.getElementById("lockScreen").style.display="none"
        document.body.style.overflow="auto"
    }else{
        document.getElementById("errorMsg").style.display="block"
    }
}

/* MENU */
function toggleMenu(){
    document.getElementById("menu").classList.toggle("active")
}

/* SECTIONS */
function showSection(id){
    document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"))
    document.getElementById(id).classList.add("active")
    document.getElementById("menu").classList.remove("active")
    window.scrollTo({top:0})
}
</script>

</body>
</html>
